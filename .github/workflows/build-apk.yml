name: Build APK - Simple Web Wrapper

on:
  push:
    branches:
      - capacitor-setup
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Create APK directories
        run: |
          mkdir -p apk-build/src/main/assets
          cp -r dist/* apk-build/src/main/assets/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-web-build
          path: apk-build/
